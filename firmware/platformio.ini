; MBD_Embedded_Rover — firmware bare-metal per ATmega328P (Arduino Uno R3)
;
; Nessun "framework": niente core Arduino, solo avr-gcc + avr-libc.
; F_CPU = 16 MHz è definito dalla board "uno".

[env:uno]
platform = atmelavr
board = uno

build_flags =
    -Wall
    -Wextra

; Upload tramite il bootloader dell'Arduino (avrdude, protocollo "arduino").
; Prima di caricare: staccare il filo su D0 (HC-05) e scollegare le pile AA.
upload_protocol = arduino

monitor_speed = 9600
